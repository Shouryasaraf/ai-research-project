name: non-privileged-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate the synthetic experiment plan
        env:
          PYTHONPATH: src
        run: python -m vfw_research.experiment_runner plan configs/scenarios/synthetic_small.json
      - name: Reproduce the small synthetic experiment
        env:
          PYTHONPATH: src
        run: >-
          python -m vfw_research.experiment_runner run
          configs/scenarios/synthetic_small.json
          --output-root "${{ runner.temp }}/vfw-artifacts"
          --batch-id ci-small
