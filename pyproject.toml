[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vfw-research"
version = "0.1.0"
description = "Research prototype for uncertainty-gated predictive warm migration of stateful virtual firewalls"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
vfw-smoke = "vfw_research.demo:main"
vfw-experiment = "vfw_research.experiment_runner:main"
vfw-forecast-eval = "vfw_research.forecast_evaluation:main"
vfw-forecast-batch = "vfw_research.forecast_batch:main"
vfw-mawi-trace = "vfw_research.mawi_trace:main"
vfw-trace-decisions = "vfw_research.trace_decision_eval:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
